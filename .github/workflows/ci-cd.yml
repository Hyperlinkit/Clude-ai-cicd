name: CI/CD Pipeline with Gemini AI Review

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────
  # STEP 1: Run Unit Tests
  # ─────────────────────────────────────────
  run-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests with coverage
        run: pytest tests/ --cov=src --cov-report=xml --cov-report=term -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ─────────────────────────────────────────
  # STEP 2: Gemini AI 3-Stage Review
  # ─────────────────────────────────────────
  gemini-ai-review:
    name: "Gemini AI Review (Quality + Tests + Structure)"
    runs-on: ubuntu-latest
    needs: run-tests

    outputs:
      review_passed: ${{ steps.parse-result.outputs.review_passed }}
      review_summary: ${{ steps.parse-result.outputs.review_summary }}
      stages_passed: ${{ steps.parse-result.outputs.stages_passed }}
      test_pass_rate: ${{ steps.parse-result.outputs.test_pass_rate }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Get changed files
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            git diff --name-only origin/${{ github.base_ref }}...HEAD > changed_files.txt
          else
            git diff --name-only HEAD~1 HEAD > changed_files.txt
          fi
          echo "Changed files:"
          cat changed_files.txt

      - name: Run Gemini AI 3-Stage Review
        id: gemini-review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/claude_test_review.py \
            --changed-files changed_files.txt \
            --output review_result.json

      - name: Parse review result
        id: parse-result
        if: always()
        run: |
          PASSED=$(python -c "import json; d=json.load(open('review_result.json')); print(d['overall_passed'])")
          SUMMARY=$(python -c "import json; d=json.load(open('review_result.json')); print(d['overall_summary'])")
          STAGES=$(python -c "import json; d=json.load(open('review_result.json')); print(str(d['stages_passed'])+'/'+str(d['stages_total']))")
          RATE=$(python -c "import json; d=json.load(open('review_result.json')); print(d['test_summary']['pass_rate'])")
          echo "review_passed=$PASSED" >> $GITHUB_OUTPUT
          echo "review_summary=$SUMMARY" >> $GITHUB_OUTPUT
          echo "stages_passed=$STAGES" >> $GITHUB_OUTPUT
          echo "test_pass_rate=$RATE" >> $GITHUB_OUTPUT

      - name: Upload Review Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-review-report
          path: review_result.json

      - name: Comment on PR with full report
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const r = JSON.parse(fs.readFileSync('review_result.json', 'utf8'));
            const emoji = r.overall_passed ? '✅' : '❌';
            const status = r.overall_passed ? 'APPROVED' : 'REJECTED';

            // Build test cases table
            let testTable = '';
            if (r.test_cases && r.test_cases.length > 0) {
              testTable = '\n\n### 🧪 Test Cases\n| Test | Status | Reason |\n|---|---|---|\n';
              for (const t of r.test_cases) {
                const icon = t.status === 'PASS' ? '✅' : '❌';
                testTable += `| ${t.test_name} | ${icon} ${t.status} | ${t.reason} |\n`;
              }
            }

            // Build stage summary
            let stageSummary = '\n\n### 📋 Stage Results\n';
            for (const s of r.stage_results || []) {
              const sIcon = s.passed ? '✅' : '❌';
              stageSummary += `- ${sIcon} **Stage ${s.stage}: ${s.stage_name}** — ${s.summary}\n`;
            }

            const ts = r.test_summary;
            const body = `## ${emoji} Gemini AI Code Review — ${status}

**Summary:** ${r.overall_summary}
**Stages:** ${r.stages_passed}/${r.stages_total} passed
**Tests:** ${ts.passed}/${ts.total} passed (${ts.pass_rate})
${stageSummary}${testTable}`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Block pipeline if review failed
        if: steps.parse-result.outputs.review_passed == 'False'
        run: |
          echo "❌ Gemini AI Review FAILED. Deployment blocked."
          echo "Stages passed: ${{ steps.parse-result.outputs.stages_passed }}"
          echo "Reason: ${{ steps.parse-result.outputs.review_summary }}"
          exit 1

  # ─────────────────────────────────────────
  # STEP 3: Deploy (only if all stages pass)
  # ─────────────────────────────────────────
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: [run-tests, gemini-ai-review]
    if: |
      github.ref == 'refs/heads/main' &&
      needs.gemini-ai-review.outputs.review_passed == 'True'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd /var/www/your-app
            git pull origin main
            pip install -r requirements.txt
            sudo systemctl restart your-app

      - name: Deployment success
        run: |
          echo "✅ Deployed successfully!"
          echo "Stages passed : ${{ needs.gemini-ai-review.outputs.stages_passed }}"
          echo "Test pass rate: ${{ needs.gemini-ai-review.outputs.test_pass_rate }}"

  # ─────────────────────────────────────────
  # Rejection Notification
  # ─────────────────────────────────────────
  notify-rejection:
    name: Notify Rejection
    runs-on: ubuntu-latest
    needs: gemini-ai-review
    if: failure()
    steps:
      - name: Download review report
        uses: actions/download-artifact@v4
        with:
          name: gemini-review-report

      - name: Print rejection report
        run: |
          echo "🚫 ============================================"
          echo "🚫  DEPLOYMENT REJECTED BY GEMINI AI REVIEW"
          echo "🚫 ============================================"
          echo ""
          echo "Stages passed : ${{ needs.gemini-ai-review.outputs.stages_passed }}"
          echo "Reason        : ${{ needs.gemini-ai-review.outputs.review_summary }}"
          echo ""
          echo "Full report:"
          cat review_result.json
