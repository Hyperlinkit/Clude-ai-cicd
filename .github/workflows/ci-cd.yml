name: CI/CD Pipeline with Claude AI Review

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────
  # STEP 1: Run Tests
  # ─────────────────────────────────────────
  run-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests with coverage
        run: pytest tests/ --cov=src --cov-report=xml --cov-report=term -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ─────────────────────────────────────────
  # STEP 2: Claude AI Code Review
  # ─────────────────────────────────────────
  claude-ai-review:
    name: Claude AI Code Review
    runs-on: ubuntu-latest
    needs: run-tests

    outputs:
      review_passed: ${{ steps.parse-result.outputs.review_passed }}
      review_summary: ${{ steps.parse-result.outputs.review_summary }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Claude SDK
        run: pip install anthropic

      - name: Get changed files
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            git diff --name-only origin/${{ github.base_ref }}...HEAD > changed_files.txt
          else
            git diff --name-only HEAD~1 HEAD > changed_files.txt
          fi
          echo "Changed files:"
          cat changed_files.txt

      - name: Run Claude AI Review
        id: claude-review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/claude_test_review.py \
            --changed-files changed_files.txt \
            --output review_result.json

      - name: Parse review result
        id: parse-result
        run: |
          PASSED=$(python -c "import json; d=json.load(open('review_result.json')); print(d['passed'])")
          SUMMARY=$(python -c "import json; d=json.load(open('review_result.json')); print(d['summary'])")
          echo "review_passed=$PASSED" >> $GITHUB_OUTPUT
          echo "review_summary=$SUMMARY" >> $GITHUB_OUTPUT

      - name: Upload Claude Review Report
        uses: actions/upload-artifact@v4
        with:
          name: claude-review-report
          path: review_result.json

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const review = JSON.parse(fs.readFileSync('review_result.json', 'utf8'));
            const emoji = review.passed ? '✅' : '❌';
            const body = `## ${emoji} Claude AI Code Review\n\n**Status:** ${review.passed ? 'PASSED' : 'FAILED'}\n\n**Summary:** ${review.summary}\n\n**Details:**\n${review.details}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Block deployment if review failed
        if: steps.parse-result.outputs.review_passed == 'False'
        run: |
          echo "❌ Claude AI Review FAILED. Deployment blocked."
          exit 1

  # ─────────────────────────────────────────
  # STEP 3: Deploy (only if both pass)
  # ─────────────────────────────────────────
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: [run-tests, claude-ai-review]
    if: |
      github.ref == 'refs/heads/main' &&
      needs.claude-ai-review.outputs.review_passed == 'True'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd /var/www/your-app
            git pull origin main
            pip install -r requirements.txt
            sudo systemctl restart your-app

      - name: Deployment success
        run: echo "✅ Deployed successfully to ${{ secrets.SERVER_HOST }}"

  # ─────────────────────────────────────────
  # Rejection Notification
  # ─────────────────────────────────────────
  notify-rejection:
    name: Notify Rejection
    runs-on: ubuntu-latest
    needs: claude-ai-review
    if: failure()
    steps:
      - name: Log rejection
        run: |
          echo "🚫 Deployment REJECTED by Claude AI"
          echo "Reason: ${{ needs.claude-ai-review.outputs.review_summary }}"
