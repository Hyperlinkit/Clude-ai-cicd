name: CI/CD Pipeline with Gemini AI Review

on:
push:
branches:
- main
- develop
pull_request:
branches:
- main

jobs:

run-tests:
name: Run Unit Tests
runs-on: ubuntu-latest

```
steps:
  - name: Checkout code
    uses: actions/checkout@v4

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.11"

  - name: Install dependencies
    run: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
      pip install pytest pytest-cov

  - name: Run tests
    run: |
      pytest tests/ \
        --cov=src \
        --cov-report=xml \
        --cov-report=term \
        -v

  - name: Upload coverage report
    uses: actions/upload-artifact@v4
    with:
      name: coverage-report
      path: coverage.xml
```

gemini-ai-review:
name: Gemini AI Review
runs-on: ubuntu-latest
needs: run-tests

```
outputs:
  review_passed: ${{ steps.parse-result.outputs.review_passed }}
  review_summary: ${{ steps.parse-result.outputs.review_summary }}
  stages_passed: ${{ steps.parse-result.outputs.stages_passed }}
  test_pass_rate: ${{ steps.parse-result.outputs.test_pass_rate }}

steps:
  - name: Checkout code
    uses: actions/checkout@v4
    with:
      fetch-depth: 0

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.11"

  - name: Get changed files
    run: |
      if [ "${{ github.event_name }}" = "pull_request" ]; then
        git diff --name-only origin/${{ github.base_ref }}...HEAD > changed_files.txt
      else
        git diff --name-only HEAD~1 HEAD > changed_files.txt
      fi

      echo "Changed files:"
      cat changed_files.txt

  - name: Run Gemini Review
    id: gemini-review
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    run: |
      python scripts/claude_test_review.py \
        --changed-files changed_files.txt \
        --output review_result.json

  - name: Parse Review Result
    id: parse-result
    if: always()
    shell: bash
    run: |

      if [ ! -f review_result.json ]; then
        echo "review_passed=false" >> $GITHUB_OUTPUT
        echo "review_summary=Review report missing" >> $GITHUB_OUTPUT
        echo "stages_passed=0/0" >> $GITHUB_OUTPUT
        echo "test_pass_rate=0%" >> $GITHUB_OUTPUT
        exit 0
      fi

      PASSED=$(python -c "import json;print(str(json.load(open('review_result.json')).get('overall_passed',False)).lower())")

      SUMMARY=$(python -c "import json;print(json.load(open('review_result.json')).get('overall_summary','No summary'))")

      STAGES=$(python -c "import json;d=json.load(open('review_result.json'));print(str(d.get('stages_passed',0))+'/'+str(d.get('stages_total',0)))")

      RATE=$(python -c "import json;print(json.load(open('review_result.json')).get('test_summary',{}).get('pass_rate','0%'))")

      echo "review_passed=$PASSED" >> $GITHUB_OUTPUT

      {
        echo "review_summary<<EOF"
        echo "$SUMMARY"
        echo "EOF"
      } >> $GITHUB_OUTPUT

      echo "stages_passed=$STAGES" >> $GITHUB_OUTPUT
      echo "test_pass_rate=$RATE" >> $GITHUB_OUTPUT

  - name: Upload Review Report
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: gemini-review-report
      path: review_result.json

  - name: Comment PR Review Report
    if: github.event_name == 'pull_request' && always()
    uses: actions/github-script@v7
    with:
      script: |
        const fs = require('fs');

        if (!fs.existsSync('review_result.json')) {
          console.log('review_result.json not found');
          return;
        }

        const r = JSON.parse(
          fs.readFileSync('review_result.json', 'utf8')
        );

        const emoji = r.overall_passed ? '✅' : '❌';
        const status = r.overall_passed ? 'APPROVED' : 'REJECTED';

        let testTable = '';

        if (r.test_cases && r.test_cases.length > 0) {
          testTable += '\n\n### 🧪 Test Cases\n';
          testTable += '| Test | Status | Reason |\n';
          testTable += '|------|--------|--------|\n';

          for (const t of r.test_cases) {
            const icon = t.status === 'PASS' ? '✅' : '❌';

            testTable +=
              `| ${t.test_name} | ${icon} ${t.status} | ${t.reason} |\n`;
          }
        }

        let stageSummary = '\n\n### 📋 Stage Results\n';

        for (const s of (r.stage_results || [])) {
          const icon = s.passed ? '✅' : '❌';

          stageSummary +=
            `- ${icon} Stage ${s.stage}: ${s.stage_name} — ${s.summary}\n`;
        }

        const ts = r.test_summary || {};

        const body =
          `## ${emoji} Gemini AI Code Review - ${status}

        **Summary:** ${r.overall_summary}

        **Stages:** ${r.stages_passed}/${r.stages_total} passed

        **Tests:** ${ts.passed}/${ts.total} passed (${ts.pass_rate})
        ${stageSummary}
        ${testTable}`;

        await github.rest.issues.createComment({
          owner: context.repo.owner,
          repo: context.repo.repo,
          issue_number: context.issue.number,
          body
        });

  - name: Fail Pipeline When Review Fails
    if: steps.parse-result.outputs.review_passed == 'false'
    run: |
      echo "Gemini AI Review Failed"
      echo "Stages Passed : ${{ steps.parse-result.outputs.stages_passed }}"
      echo "Reason        : ${{ steps.parse-result.outputs.review_summary }}"
      exit 1
```

deploy:
name: Deploy Application
runs-on: ubuntu-latest

```
needs:
  - run-tests
  - gemini-ai-review

if: |
  github.ref == 'refs/heads/main' &&
  needs.gemini-ai-review.outputs.review_passed == 'true'

steps:
  - name: Checkout code
    uses: actions/checkout@v4

  - name: Deploy via SSH
    uses: appleboy/ssh-action@v1.0.3
    with:
      host: ${{ secrets.SERVER_HOST }}
      username: ${{ secrets.SERVER_USER }}
      password: ${{ secrets.SERVER_PASSWORD }}
      port: ${{ secrets.SERVER_PORT }}
      script: |
        cd /var/www/your-app

        git pull origin main

        pip install -r requirements.txt

        sudo systemctl restart your-app

  - name: Deployment Success
    run: |
      echo "Deployment completed successfully"
      echo "Stages Passed : ${{ needs.gemini-ai-review.outputs.stages_passed }}"
      echo "Test Pass Rate: ${{ needs.gemini-ai-review.outputs.test_pass_rate }}"
```

notify-rejection:
name: Notify Rejection
runs-on: ubuntu-latest

```
needs:
  - gemini-ai-review

if: needs.gemini-ai-review.result == 'failure'

steps:
  - name: Download Review Report
    uses: actions/download-artifact@v4
    with:
      name: gemini-review-report

  - name: Print Rejection Details
    run: |
      echo "======================================"
      echo "DEPLOYMENT REJECTED"
      echo "======================================"

      echo "Stages Passed:"
      echo "${{ needs.gemini-ai-review.outputs.stages_passed }}"

      echo ""

      echo "Reason:"
      echo "${{ needs.gemini-ai-review.outputs.review_summary }}"

      echo ""

      cat review_result.json
```
